name: Android Multi-Arch Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      run: |
        sudo apt update
        sudo apt install -y python3 python3-dev python3-pip
        pip3 install cython

    - name: Install Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        unzip android-ndk-r26d-linux.zip
        echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

    - name: Generate C from Python
      run: |
        cython --embed -o main.c main.py

    - name: Build arm64-v8a
      run: |
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
        main.c -o main_arm64 -lm -ldl

    - name: Build armeabi-v7a
      run: |
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang \
        main.c -o main_armv7 -lm -ldl

    - name: Strip binaries
      run: |
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip main_arm64
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip main_armv7

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-binaries
        path: |
          main_arm64
          main_armv7
